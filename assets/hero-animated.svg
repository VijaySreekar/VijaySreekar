<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">London to cloud</title>
  <desc id="desc">An animated twilight London skyline flows into cloud infrastructure and softly moving data signals.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17243a"/>
      <stop offset="0.46" stop-color="#0d1727"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6b85c" stop-opacity=".34"/>
      <stop offset=".38" stop-color="#e6b85c" stop-opacity=".06"/>
      <stop offset="1" stop-color="#35b9ff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f33"/>
      <stop offset="1" stop-color="#050b13"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#61cbff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#35b9ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#35b9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="largeGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <path id="routeA" d="M405 225 C560 198 630 239 760 185 S1010 145 1238 78"/>
    <path id="routeB" d="M510 250 C650 214 732 260 850 213 S1060 200 1252 138"/>
    <path id="routeC" d="M350 190 C525 168 620 178 730 140 S948 112 1130 122"/>
    <style>
      .signal { filter: url(#softGlow); }
      .window { fill: #f2c96d; }
      .node { fill: #61cbff; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>
  <ellipse cx="250" cy="238" rx="330" ry="115" fill="#e7a747" opacity=".10" filter="url(#largeGlow)"/>
  <rect y="145" width="1280" height="175" fill="url(#horizon)"/>

  <g fill="#c7eaff" opacity=".38">
    <circle cx="86" cy="55" r="1"/><circle cx="174" cy="91" r="1.2"/><circle cx="287" cy="44" r=".8"/>
    <circle cx="395" cy="78" r="1"/><circle cx="516" cy="38" r=".8"/><circle cx="627" cy="92" r="1"/>
    <circle cx="738" cy="50" r="1.1"/><circle cx="870" cy="77" r=".7"/><circle cx="1061" cy="45" r="1"/>
    <circle cx="1178" cy="92" r=".8"/>
  </g>
  <g class="motion" fill="#c7eaff">
    <circle cx="174" cy="91" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="738" cy="50" r="1.4"><animate attributeName="opacity" values=".25;.9;.25" dur="3.7s" begin="-1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1061" cy="45" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="5.2s" begin="-2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- layered clouds -->
  <g fill="#142b46" stroke="#254d72" stroke-width="1.2" opacity=".96">
    <path d="M724 214c0-22 17-40 39-40 8 0 15 2 21 6 8-30 34-51 66-51 35 0 64 26 68 60 7-5 16-8 25-8 22 0 40 17 42 38H724z"/>
    <path d="M889 181c2-28 24-50 52-50 10 0 19 3 27 7 11-35 42-59 79-59 44 0 79 34 82 77 9-7 21-11 33-11 30 0 54 23 57 52H889z"/>
    <path d="M1052 221c2-25 22-45 48-45 7 0 14 2 20 5 10-28 36-47 66-47 38 0 69 30 71 67 8-6 17-9 27-9 26 0 47 20 49 45h-281z"/>
  </g>
  <g fill="none" stroke="#35b9ff" stroke-width="2" opacity=".72">
    <path d="M760 198c5-15 19-26 36-26 7 0 14 2 19 6 9-26 33-44 61-44 32 0 59 24 63 55"/>
    <path d="M931 168c8-24 30-41 56-41 9 0 18 2 25 6 13-31 43-52 78-52 41 0 76 30 82 70"/>
  </g>

  <!-- simplified London skyline -->
  <g fill="#09121e" stroke="#213c58" stroke-width="1">
    <path d="M0 244v-56h14v-20h9v20h19v56zm48 0v-79h8v-18h5v18h8v79zm29 0v-49h19v-23h7v23h18v49z"/>
    <path d="M117 244v-64h15v-17h7v17h14v64zm44 0v-42h20v-18h9v18h24v42zm62 0v-74h13v-21h8v21h14v74z"/>
    <path d="M265 244v-92h20v-18h8v18h18v92zm51 0v-52h26v-28h10v28h24v52z"/>
  </g>

  <!-- Elizabeth Tower -->
  <g>
    <path d="M150 244h64l-7-104h-50z" fill="#0a1522" stroke="#2c4f6e" stroke-width="1.4"/>
    <path d="M158 140h48l-5-18h-38z" fill="#111f2e"/>
    <path d="M164 122h36l-7-23h-22z" fill="#0a1522"/>
    <path d="M176 99l6-32 6 32z" fill="#0a1522"/>
    <circle cx="182" cy="145" r="13" fill="#e8c267" stroke="#f6dc94" stroke-width="1.5"/>
    <circle cx="182" cy="145" r="10" fill="#142234"/>
    <path d="M182 145l-1-7m1 7 6 3" stroke="#f5d98d" stroke-width="1.3" stroke-linecap="round"/>
    <g class="window">
      <rect x="164" y="171" width="5" height="8" rx="1"/><rect x="178" y="171" width="5" height="8" rx="1"/><rect x="193" y="171" width="5" height="8" rx="1"/>
      <rect x="166" y="197" width="5" height="10" rx="1"/><rect x="180" y="197" width="5" height="10" rx="1"/><rect x="194" y="197" width="5" height="10" rx="1"/>
    </g>
  </g>

  <!-- bridge and river -->
  <path d="M0 241h490v14H0z" fill="#101e2d"/>
  <path d="M0 250c64-28 102-28 165 0 63-28 105-28 168 0 57-24 103-25 157 0" fill="none" stroke="#2c4d67" stroke-width="6"/>
  <rect y="262" width="1280" height="58" fill="url(#river)"/>
  <g stroke-linecap="round" opacity=".45">
    <path d="M154 271v29" stroke="#e6b85c" stroke-width="3"/><path d="M182 267v39" stroke="#e6b85c" stroke-width="2"/>
    <path d="M206 271v26" stroke="#e6b85c"/><path d="M817 274v21" stroke="#35b9ff"/><path d="M930 270v29" stroke="#35b9ff" stroke-width="2"/>
  </g>

  <!-- cloud infrastructure -->
  <g fill="#0b1726" stroke="#315d7f" stroke-width="1.2">
    <rect x="820" y="191" width="78" height="67" rx="4"/>
    <rect x="912" y="169" width="98" height="89" rx="4"/>
    <rect x="1024" y="202" width="76" height="56" rx="4"/>
    <rect x="1114" y="179" width="112" height="79" rx="4"/>
  </g>
  <g fill="#35b9ff">
    <rect x="833" y="207" width="51" height="3" rx="1.5"/><rect x="833" y="220" width="37" height="3" rx="1.5"/><rect x="833" y="233" width="46" height="3" rx="1.5"/>
    <rect x="928" y="185" width="60" height="3" rx="1.5"/><rect x="928" y="199" width="47" height="3" rx="1.5"/><rect x="928" y="213" width="58" height="3" rx="1.5"/><rect x="928" y="227" width="41" height="3" rx="1.5"/>
    <rect x="1037" y="217" width="48" height="3" rx="1.5"/><rect x="1037" y="231" width="34" height="3" rx="1.5"/>
    <rect x="1130" y="195" width="72" height="3" rx="1.5"/><rect x="1130" y="209" width="52" height="3" rx="1.5"/><rect x="1130" y="223" width="66" height="3" rx="1.5"/>
  </g>
  <g class="window">
    <circle cx="884" cy="208" r="2"/><circle cx="884" cy="221" r="2"/><circle cx="884" cy="234" r="2"/>
    <circle cx="992" cy="186" r="2"/><circle cx="992" cy="200" r="2"/><circle cx="992" cy="214" r="2"/><circle cx="992" cy="228" r="2"/>
    <circle cx="1087" cy="218" r="2"/><circle cx="1087" cy="232" r="2"/>
  </g>

  <!-- routes and nodes -->
  <g fill="none" stroke-linecap="round">
    <use href="#routeA" stroke="#35b9ff" stroke-opacity=".31" stroke-width="1.6" stroke-dasharray="3 7"/>
    <use href="#routeB" stroke="#61cbff" stroke-opacity=".24" stroke-width="1.4"/>
    <use href="#routeC" stroke="#e6b85c" stroke-opacity=".28" stroke-width="1.3"/>
  </g>
  <g class="motion signal">
    <circle r="4" fill="#61cbff"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#routeA"/></animateMotion></circle>
    <circle r="3" fill="#e6b85c"><animateMotion dur="10s" begin="-5s" repeatCount="indefinite"><mpath href="#routeB"/></animateMotion></circle>
    <circle r="3.5" fill="#61cbff"><animateMotion dur="8.5s" begin="-2.5s" repeatCount="indefinite"><mpath href="#routeC"/></animateMotion></circle>
  </g>
  <g class="node signal">
    <circle cx="760" cy="185" r="3"/><circle cx="850" cy="213" r="3"/><circle cx="918" cy="154" r="3"/>
    <circle cx="1010" cy="145" r="3"/><circle cx="1100" cy="113" r="3"/><circle cx="1190" cy="92" r="3"/>
  </g>

  <g class="motion" opacity=".14">
    <rect x="-180" y="0" width="170" height="320" fill="#76d6ff" transform="skewX(-18)">
      <animate attributeName="x" values="-180;1450" dur="13s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1278" height="318" rx="18" fill="none" stroke="#5bc7ff" stroke-opacity=".18" stroke-width="2"/>
</svg>
